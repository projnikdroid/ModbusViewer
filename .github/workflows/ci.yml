name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the default MSVC arch on windows-latest rather than the MinGW kit
      # local dev uses (see README.md/CLAUDE.md) -- the code has no MinGW-specific
      # dependency, and MSVC is the better-supported path for this action on
      # GitHub-hosted Windows runners.
      #
      # Pinned to 6.10.3 rather than local dev's 6.11.1: as of 2026-07-29,
      # aqtinstall can't fetch Windows-desktop metadata for 6.11.0/6.11.1/6.12.0
      # specifically ("Failed to locate XML data for Qt version") -- confirmed
      # not a mirror-selection problem (jurplel/install-qt-action@v4 has no
      # `mirror` input, and the same failure reproduces querying download.qt.io
      # directly from a completely different network) and not a general aqt/
      # network issue (linux desktop and older Windows versions like 6.10.3/
      # 6.8.1 all resolve fine). Looks like a still-propagating CDN gap for the
      # newest Windows point releases. Bump back to 6.11.1 once that clears --
      # check with `aqt list-qt windows desktop --arch 6.11.1`.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: "qtserialport"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Debug
