name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the default MSVC arch on windows-latest rather than the MinGW kit
      # local dev uses (see README.md/CLAUDE.md) -- the code has no MinGW-specific
      # dependency, and MSVC is the better-supported path for this action on
      # GitHub-hosted Windows runners.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: "qtserialport"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Debug
