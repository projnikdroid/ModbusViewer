name: CI

on:
  # Deliberately not on every push/PR to main -- this project is a solo repo
  # right now and CI on every commit was pure noise. Runs only for an actual
  # release (a `vX.Y.Z` tag, pushed alongside a CMakeLists.txt version bump,
  # same as the v1.1.0 release), on demand via workflow_dispatch, or the
  # existing weekly CodeQL sweep. Revisit if this project ever takes outside
  # contributions -- PRs from external contributors should probably get
  # automatic CI again at that point.
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC -- catches new CodeQL query-pack findings even
    # when the code itself hasn't changed.
    - cron: "0 6 * * 1"

jobs:
  build-test-and-analyze:
    runs-on: windows-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Uses the default MSVC arch on windows-latest rather than the MinGW kit
      # local dev uses (see README.md/CLAUDE.md) -- the code has no MinGW-specific
      # dependency, and MSVC is the better-supported path for this action on
      # GitHub-hosted Windows runners. `cache: true` reuses the extracted Qt SDK
      # across runs instead of re-downloading it from Qt's CDN every time.
      #
      # Pinned to 6.10.3 rather than local dev's 6.11.1: as of 2026-07-29,
      # aqtinstall can't fetch Windows-desktop metadata for 6.11.0/6.11.1/6.12.0
      # specifically ("Failed to locate XML data for Qt version") -- confirmed
      # not a mirror-selection problem (jurplel/install-qt-action@v4 has no
      # `mirror` input, and the same failure reproduces querying download.qt.io
      # directly from a completely different network) and not a general aqt/
      # network issue (linux desktop and older Windows versions like 6.10.3/
      # 6.8.1 all resolve fine). Looks like a still-propagating CDN gap for the
      # newest Windows point releases. Bump back to 6.11.1 once that clears --
      # check with `aqt list-qt windows desktop --arch 6.11.1`.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: "qtserialport"
          cache: true

      # CodeQL's C/C++ analysis works by watching the compiler invocations of a
      # real build, so it has to be initialized before that build runs -- there's
      # no separate "CodeQL build" needed, the one build below serves both this
      # and the test step, instead of running install-qt + build twice across
      # two separate workflows/jobs.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
