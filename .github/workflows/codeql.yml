name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC -- catches new query-pack findings even when the
    # code itself hasn't changed.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # Pinned to 6.10.3 rather than local dev's 6.11.1 -- see ci.yml for why
      # (a still-propagating CDN gap for Windows builds of the three newest Qt
      # point releases as of 2026-07-29, not a config issue).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: "qtserialport"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      # CodeQL's C/C++ analysis needs the code to actually build.
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
